<!DOCTYPE html>
<html lang="en" class="lf-extension-doc" id="lfRoot">
  <head>
    <meta charset="UTF-8" />
    <title>MegaLeadsAI</title>
    <link rel="stylesheet" href="styles/ui.css" />
  </head>
  <body class="lf-ui lf-popup">
    <div class="lf-popup-inner">
      <div class="lf-header lf-popup-header">
        <div class="lf-header-main lf-popup-header-logo">
          <img
            class="lf-logo lf-logo-theme"
            src="Assets/logo2.png"
            data-logo-light="Assets/logo2.png"
            data-logo-dark="Assets/logo3.png"
            alt="MegaLeadsAI"
            width="180"
            height="41"
          />
        </div>
        <div class="lf-header-email-progress" id="lfPopupHeaderProgressWrap" hidden role="group">
          <p class="lf-header-email-progress-label" id="lfPopupFreeTierLabel"></p>
          <div class="lf-header-email-progress-top">
            <span class="lf-header-email-progress-count" id="lfPopupHeaderProgressCount"></span>
          </div>
          <div class="lf-header-email-progress-bar" id="lfPopupHeaderProgressBar" aria-hidden="true">
            <div class="lf-header-email-progress-fill" id="lfPopupHeaderProgressFill"></div>
          </div>
        </div>
        <div class="lf-header-actions" role="toolbar" aria-label="Get Infinite Emails, account, and theme">
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-btn-upgrade-popup"
            id="lfUpgrade"
            aria-label="Get Infinite Emails (Stripe checkout)"
            title="Get Infinite Emails"
          >
            <span class="lf-upgrade-icon" aria-hidden="true">◇</span>
            <span class="lf-upgrade-label">Get Infinite Emails</span>
          </button>
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-btn-icon lf-account-btn"
            id="lfAccountBtn"
            aria-label="Account — opens dashboard to sign in"
            title="Account"
          >
            <svg class="lf-header-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-theme-toggle"
            id="lfThemeToggle"
            aria-label="Switch to dark mode"
            title="Dark mode"
          >
            <span class="lf-theme-toggle-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </div>

      <div class="lf-login-toast" id="lfLoginToast" hidden role="status">
        <span class="lf-login-toast-text" id="lfLoginToastText"></span>
        <button type="button" class="lf-login-toast-dismiss" id="lfLoginToastDismiss" aria-label="Dismiss">×</button>
      </div>

      <div class="lf-popup-gate-banner" id="lfPopupAuthBanner" hidden role="region" aria-labelledby="lfPopupAuthTitle">
        <p class="lf-popup-gate-title" id="lfPopupAuthTitle"></p>
        <p class="lf-popup-gate-body" id="lfPopupAuthBody"></p>
        <button type="button" class="lf-btn lf-btn-primary lf-popup-gate-cta" id="lfPopupAuthCta"></button>
      </div>
      <div class="lf-popup-gate-banner lf-popup-gate-banner-warn" id="lfPopupCapBanner" hidden role="region">
        <p class="lf-popup-gate-title" id="lfPopupCapTitle"></p>
        <p class="lf-popup-gate-body" id="lfPopupCapBody"></p>
        <button type="button" class="lf-btn lf-btn-primary lf-popup-gate-cta" id="lfPopupCapUpgrade"></button>
      </div>

      <div class="lf-field">
        <span class="lf-field-label" id="lfModeLabel">Mode</span>
        <div
          class="lf-mode-icons"
          role="group"
          aria-labelledby="lfModeLabel"
        >
          <button
            type="button"
            class="lf-mode-btn lf-mode-btn-active"
            id="lfModeFollowers"
            data-mode="followers"
            aria-pressed="true"
            title="Followers"
          >
            <svg
              class="lf-mode-icon lf-mode-icon-stroke"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <!-- Arrow toward profile (incoming followers) + person — gap between arrow tip and figure -->
              <path d="M2 12h3M5 8.5L9.5 12 5 15.5" />
              <circle cx="18.5" cy="8" r="2.5" />
              <path d="M12 20.5v-2a6 6 0 0 1 12 0v2" />
            </svg>
            <span class="lf-mode-text">Followers</span>
          </button>
          <button
            type="button"
            class="lf-mode-btn"
            id="lfModeFollowing"
            data-mode="following"
            aria-pressed="false"
            title="Following"
          >
            <svg
              class="lf-mode-icon lf-mode-icon-stroke"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <!-- Person + arrow away — gap between figure and arrow -->
              <circle cx="6" cy="8" r="2.5" />
              <path d="M0 20.5v-2a6 6 0 0 1 12 0v2" />
              <path d="M14.5 12h4.5M19 8.5L23 12 19 15.5" />
            </svg>
            <span class="lf-mode-text">Following</span>
          </button>
          <button
            type="button"
            class="lf-mode-btn"
            id="lfModeHashtag"
            data-mode="hashtag"
            aria-pressed="false"
            title="Hashtag"
          >
            <svg
              class="lf-mode-icon lf-mode-icon-stroke"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <!-- Hashtag # -->
              <path d="M4 9h16M4 15h16M9 4l-2 16M15 4l-2 16" />
            </svg>
            <span class="lf-mode-text">Hashtag</span>
          </button>
        </div>
      </div>

      <div class="lf-field">
        <label for="lfQuery" id="lfQueryLabel">Username</label>
        <input type="text" id="lfQuery" placeholder="e.g. exampleuser or @exampleuser" autocomplete="off" />
      </div>

      <div class="lf-field">
        <div class="lf-field-label-row">
          <label for="lfMinFollowers" id="lfMinFollowersLabel">Minimum followers</label>
          <button
            type="button"
            class="lf-info-btn"
            id="lfInfoMinFollowers"
            aria-expanded="false"
            aria-controls="lfHelpMinFollowers"
          >
            i
          </button>
        </div>
        <p class="lf-field-help" id="lfHelpMinFollowers" hidden role="region"></p>
        <input type="number" id="lfMinFollowers" min="0" step="1" value="1000" />
      </div>

      <div class="lf-field lf-profile-limit-field">
        <div class="lf-field-label-row">
          <label for="lfProfileLimitSlider" id="lfProfileLimitLabel">Limit max extract No.</label>
          <button
            type="button"
            class="lf-info-btn"
            id="lfInfoProfileLimit"
            aria-expanded="false"
            aria-controls="lfHelpProfileLimit"
          >
            i
          </button>
        </div>
        <p class="lf-field-help" id="lfHelpProfileLimit" hidden role="region"></p>
        <label class="lf-limit-toggle-row" for="lfProfileLimitEnabled">
          <input type="checkbox" id="lfProfileLimitEnabled" checked />
          <span id="lfProfileLimitEnabledLabel">Use max extraction limit</span>
        </label>
        <div class="lf-profile-limit-row">
          <input
            type="range"
            id="lfProfileLimitSlider"
            min="10"
            max="600"
            step="5"
            value="50"
            aria-valuemin="10"
            aria-valuemax="600"
            aria-describedby="lfProfileLimitReadout"
          />
          <span class="lf-profile-limit-readout" id="lfProfileLimitReadout" aria-live="polite">50</span>
        </div>
      </div>

      <div class="lf-field lf-delay-field">
        <label for="lfDelaySlider" id="lfDelayLabel"
          >Delay between requests (gather pages and profile enrich)</label
        >
        <div class="lf-delay-slider-row">
          <input
            type="range"
            id="lfDelaySlider"
            min="3"
            max="30"
            step="1"
            value="15"
            aria-valuemin="3"
            aria-valuemax="30"
            aria-describedby="lfDelayReadout"
          />
          <span class="lf-delay-readout" id="lfDelayReadout" aria-live="polite">15–17 s</span>
        </div>
      </div>

      <p class="lf-popup-hint">
        Keep an Instagram tab open in this window, then tap Start. A dashboard tab opens with progress and results.
      </p>

      <div id="lfRiskToast" class="lf-toast-wrap" hidden>
        <div class="lf-toast-panel" role="dialog" aria-modal="false" aria-labelledby="lfRiskToastText">
          <p class="lf-toast-text" id="lfRiskToastText"></p>
          <button type="button" class="lf-btn lf-btn-primary lf-toast-ok" id="lfRiskToastOk">OK</button>
        </div>
      </div>

      <p class="lf-popup-status" id="lfPopupStatus" aria-live="polite" hidden></p>

      <div class="lf-actions-top">
        <button type="button" class="lf-btn lf-btn-primary lf-btn-start" id="lfStart">Start extraction</button>
        <button type="button" class="lf-btn lf-btn-danger" id="lfStop" disabled>Stop</button>
      </div>
    </div>

    <div class="lf-modal-backdrop lf-popup-auth-modal-wrap" id="lfPopupAuthSignupWrap" hidden>
      <div
        class="lf-modal-card lf-popup-auth-signup-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lfPopupAuthSignupTitle"
      >
        <h3 class="lf-modal-title" id="lfPopupAuthSignupTitle"></h3>
        <p class="lf-account-modal-desc" id="lfPopupAuthSignupLead"></p>
        <form id="lfPopupAuthSignupForm">
          <div class="lf-account-field">
            <label for="lfPopupAuthSignupEmail" id="lfPopupAuthSignupEmailLabel"></label>
            <input type="email" id="lfPopupAuthSignupEmail" autocomplete="email" required />
          </div>
          <div class="lf-account-field">
            <label for="lfPopupAuthSignupPassword" id="lfPopupAuthSignupPasswordLabel"></label>
            <input
              type="password"
              id="lfPopupAuthSignupPassword"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <div class="lf-account-field">
            <label for="lfPopupAuthSignupConfirm" id="lfPopupAuthSignupConfirmLabel"></label>
            <input
              type="password"
              id="lfPopupAuthSignupConfirm"
              autocomplete="new-password"
              required
              minlength="8"
            />
          </div>
          <p class="lf-account-modal-warn" id="lfPopupAuthSignupError" hidden></p>
          <button type="submit" class="lf-btn lf-btn-primary lf-popup-auth-submit" id="lfPopupAuthSignupSubmit"></button>
        </form>
        <div class="lf-account-modal-actions">
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAuthSignupSwitchLogin"></button>
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAuthSignupClose"></button>
        </div>
      </div>
    </div>

    <div class="lf-modal-backdrop lf-popup-auth-modal-wrap" id="lfPopupAuthLoginWrap" hidden>
      <div
        class="lf-modal-card lf-popup-auth-login-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lfPopupAuthLoginTitle"
      >
        <h3 class="lf-modal-title" id="lfPopupAuthLoginTitle"></h3>
        <p class="lf-account-modal-desc" id="lfPopupAuthLoginLead"></p>
        <form id="lfPopupAuthLoginForm">
          <div class="lf-account-field">
            <label for="lfPopupAuthLoginEmail" id="lfPopupAuthLoginEmailLabel"></label>
            <input type="email" id="lfPopupAuthLoginEmail" autocomplete="email" required />
          </div>
          <div class="lf-account-field">
            <label for="lfPopupAuthLoginPassword" id="lfPopupAuthLoginPasswordLabel"></label>
            <input
              type="password"
              id="lfPopupAuthLoginPassword"
              autocomplete="current-password"
              required
              minlength="8"
            />
          </div>
          <p class="lf-account-modal-warn" id="lfPopupAuthLoginError" hidden></p>
          <button type="submit" class="lf-btn lf-btn-primary lf-popup-auth-submit" id="lfPopupAuthLoginSubmit"></button>
        </form>
        <div class="lf-account-modal-actions">
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAuthLoginSwitchSignup"></button>
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAuthLoginClose"></button>
        </div>
      </div>
    </div>

    <div class="lf-modal-backdrop lf-popup-account-modal-wrap" id="lfPopupAccountUsageWrap" hidden>
      <div
        class="lf-modal-card lf-account-modal lf-account-usage-modal lf-popup-account-usage-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lfPopupAccountUsageTitle"
      >
        <h3 class="lf-modal-title" id="lfPopupAccountUsageTitle"></h3>
        <p class="lf-account-modal-line" id="lfPopupAccountUsageSignedIn"></p>
        <p class="lf-account-modal-line" id="lfPopupAccountUsageCount"></p>
        <div class="lf-account-usage-bar-wrap" id="lfPopupAccountUsageBarWrap" aria-hidden="true">
          <div class="lf-account-usage-bar">
            <div class="lf-account-usage-bar-fill" id="lfPopupAccountUsageBarFill"></div>
          </div>
          <div class="lf-account-usage-bar-label" id="lfPopupAccountUsageBarLabel"></div>
        </div>
        <p class="lf-account-modal-desc" id="lfPopupAccountUsageCapNote"></p>
        <p class="lf-account-modal-warn" id="lfPopupAccountUsageAtCap" hidden></p>
        <div class="lf-account-usage-cta-row">
          <button type="button" class="lf-btn-stripe-diamond" id="lfPopupAccountStripeDiamond" aria-label="">
            <span class="lf-btn-stripe-diamond-inner" aria-hidden="true"></span>
            <span class="lf-btn-stripe-diamond-label" id="lfPopupAccountStripeDiamondLabel"></span>
          </button>
        </div>
        <div class="lf-account-modal-actions lf-account-modal-actions-footer">
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAccountUsageLogout"></button>
          <button type="button" class="lf-btn lf-btn-ghost" id="lfPopupAccountUsageClose"></button>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/popup.js"></script>
  </body>
</html>
