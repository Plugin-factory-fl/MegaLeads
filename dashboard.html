<!DOCTYPE html>
<html lang="en" class="lf-extension-doc" id="lfRoot">
  <head>
    <meta charset="UTF-8" />
    <title>MegaLeadsAI - Dashboard</title>
    <link rel="stylesheet" href="styles/ui.css" />
    <!-- SheetJS (SheetJS CE) — .xlsx export; see https://sheetjs.com -->
    <script src="libs/xlsx.full.min.js"></script>
  </head>
  <body class="lf-ui lf-dashboard">
    <div class="lf-app">
      <header class="lf-header">
        <div class="lf-header-main">
          <img
            class="lf-logo lf-logo-theme"
            src="Assets/logo2.png"
            data-logo-light="Assets/logo2.png"
            data-logo-dark="Assets/logo3.png"
            alt="MegaLeadsAI"
            width="202"
            height="46"
          />
        </div>
        <div class="lf-header-actions" role="toolbar" aria-label="Appearance">
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-theme-toggle"
            id="lfThemeToggle"
            aria-label="Switch to dark mode"
            title="Dark mode"
          >
            <span class="lf-theme-toggle-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <p class="lf-dashboard-hint">
        Progress and results for the current run. Mode, hashtag, and delays are in the toolbar popup.
      </p>

      <section class="lf-ai-panel" aria-labelledby="lfAiPanelTitle">
        <div class="lf-ai-panel-head">
          <h2 class="lf-ai-panel-title" id="lfAiPanelTitle">AI</h2>
          <p class="lf-ai-panel-desc" id="lfAiPanelDesc"></p>
        </div>
        <div class="lf-ai-panel-row">
          <label class="lf-check">
            <input type="checkbox" id="lfAiLlm" checked />
            <span id="lfAiLlmLabel"></span>
          </label>
          <label class="lf-check">
            <input type="checkbox" id="lfAiFetchUrl" checked />
            <span id="lfAiFetchUrlLabel"></span>
          </label>
          <label class="lf-check">
            <input type="checkbox" id="lfAiExcludeFake" checked />
            <span id="lfAiExcludeFakeLabel"></span>
          </label>
          <button type="button" class="lf-btn lf-btn-primary" id="lfAiEnrich"></button>
        </div>
        <p class="lf-ai-panel-status" id="lfAiStatus" aria-live="polite"></p>
        <p class="lf-ai-panel-hint" id="lfSheetsHint" hidden></p>
      </section>

      <div class="lf-session-bar" id="lfSessionBar">
        <div class="lf-session-main">
          <div class="lf-session-title">Current extraction</div>
          <div class="lf-session-line">
            <span class="lf-session-target" id="lfSessionTarget">—</span>
            <span class="lf-session-mode" id="lfSessionMode"></span>
          </div>
          <div class="lf-session-goal" id="lfSessionGoal" hidden></div>
          <a
            class="lf-session-link"
            id="lfSessionLink"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
            >Open source page on Instagram</a>
        </div>
        <button type="button" class="lf-btn lf-btn-primary lf-session-stop" id="lfDashboardStop">
          Start extraction
        </button>
      </div>

      <div class="lf-progress-wrap">
        <div class="lf-progress-bar" id="lfProgressBar">
          <span class="lf-progress-fill" id="lfProgressFill"></span>
        </div>
        <div class="lf-progress-label" id="lfProgressLabel"></div>
        <div class="lf-progress-status" id="lfProgressStatus"></div>
      </div>

      <div class="lf-history-shell" id="lfHistoryShell">
        <button
          type="button"
          class="lf-history-toggle"
          id="lfHistoryToggle"
          aria-expanded="false"
          aria-controls="lfHistoryBody"
        >
          <span class="lf-history-toggle-label" id="lfHistoryLabel">Extraction history</span>
          <span class="lf-history-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="lf-history-body" id="lfHistoryBody" hidden>
          <div class="lf-history-head">
            <button type="button" class="lf-btn lf-btn-ghost lf-history-clear" id="lfHistoryClear">
              Clear history
            </button>
          </div>
          <div class="lf-history-list" id="lfHistoryList" role="listbox" aria-label="Extraction history"></div>
        </div>
      </div>

      <p class="lf-section-title">Results</p>
      <div class="lf-toolbar">
        <input type="search" id="lfFilter" placeholder="Filter by username, bio, email, phone, or website…" />
        <button type="button" class="lf-btn lf-btn-ghost" id="lfCopy">Copy selected</button>
        <button type="button" class="lf-btn lf-btn-ghost" id="lfExportProfiles">Export profiles to Excel</button>
        <button type="button" class="lf-btn lf-btn-ghost" id="lfExportEmails">Export emails to Excel</button>
        <button type="button" class="lf-btn lf-btn-ghost" id="lfOpenSheets">Google Sheets</button>
        <button type="button" class="lf-btn lf-btn-ghost" id="lfClear">Clear list</button>
      </div>

      <div class="lf-table-wrap">
        <table class="lf-table" id="lfTable">
          <thead>
            <tr>
              <th class="lf-col-check"><input type="checkbox" id="lfSelectAll" title="Select all" /></th>
              <th data-sort="username">Username</th>
              <th data-sort="followerCount">Follower</th>
              <th data-sort="bio">Bio</th>
              <th data-sort="email">Email</th>
              <th data-sort="phone">Phone</th>
              <th data-sort="websiteUrl">Website</th>
            </tr>
          </thead>
          <tbody id="lfTableBody"></tbody>
        </table>
      </div>

      <footer class="lf-footer">Built by Tommaso Parisi</footer>
    </div>

    <div class="lf-ai-summary-wrap" id="lfAiSummaryWrap" hidden>
      <div class="lf-ai-summary-card" role="dialog" aria-modal="true" aria-labelledby="lfAiSummaryTitle">
        <h3 class="lf-ai-summary-title" id="lfAiSummaryTitle">AI Enrichment Summary</h3>
        <p class="lf-ai-summary-line" id="lfAiSummaryScraped"></p>
        <p class="lf-ai-summary-line" id="lfAiSummaryAdded"></p>
        <p class="lf-ai-summary-improved" id="lfAiSummaryImproved"></p>
        <button type="button" class="lf-btn lf-btn-primary lf-ai-summary-ok" id="lfAiSummaryOk">OK</button>
      </div>
    </div>

    <div class="lf-josh-wrap" id="lfJoshAvatar" aria-hidden="false">
      <div class="lf-josh-thought-wrap" id="lfJoshThoughtWrap">
        <div class="lf-josh-thought-simple" id="lfJoshThoughtSimple">
          <span
            class="lf-josh-avatar-thought"
            id="lfJoshAvatarThought"
            tabindex="0"
            role="button"
            aria-label="Click to chat with Josh"
          ></span>
        </div>
        <div class="lf-josh-thought-chat hidden" id="lfJoshThoughtChat">
          <button type="button" class="lf-josh-thought-close" id="lfJoshThoughtClose" aria-label="Close">×</button>
          <div class="lf-josh-thought-messages" id="lfJoshThoughtMessages"></div>
          <div class="lf-josh-thought-chat-input-row">
            <input
              type="text"
              class="lf-josh-thought-chat-input"
              id="lfJoshThoughtChatInput"
              placeholder="Ask Josh to help with your leads..."
              autocomplete="off"
            />
            <button type="button" class="lf-josh-thought-chat-send" id="lfJoshThoughtChatSend" aria-label="Send">
              →
            </button>
          </div>
        </div>
      </div>
      <div class="lf-josh-avatar-bubble">
        <img src="Assets/Joshpropic.png" alt="Josh" class="lf-josh-avatar-img" draggable="false" />
      </div>
      <button type="button" class="lf-josh-avatar-help" id="lfJoshAvatarHelp" aria-label="Ask Josh a question">?</button>
    </div>

    <script type="module" src="scripts/dashboard.js"></script>
  </body>
</html>
