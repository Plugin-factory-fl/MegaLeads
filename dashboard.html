<!DOCTYPE html>
<html lang="en" class="lf-extension-doc" id="lfRoot">
  <head>
    <meta charset="UTF-8" />
    <title>MegaLeadsAI - Dashboard</title>
    <link rel="stylesheet" href="styles/ui.css" />
    <!-- SheetJS (SheetJS CE) — .xlsx export; see https://sheetjs.com -->
    <script src="libs/xlsx.full.min.js"></script>
  </head>
  <body class="lf-ui lf-dashboard">
    <div class="lf-app">
      <header class="lf-header lf-dashboard-header">
        <div class="lf-header-main lf-dashboard-header-logo">
          <img
            class="lf-logo lf-logo-theme lf-dashboard-header-logo-img"
            src="Assets/logo2.png"
            data-logo-light="Assets/logo2.png"
            data-logo-dark="Assets/logo3.png"
            alt="MegaLeadsAI"
            width="323"
            height="74"
          />
        </div>
        <div class="lf-header-email-progress" id="lfDashboardHeaderProgressWrap" hidden role="group">
          <p class="lf-header-email-progress-label" id="lfDashboardFreeTierLabel"></p>
          <div class="lf-header-email-progress-top">
            <span class="lf-header-email-progress-count" id="lfDashboardHeaderProgressCount"></span>
          </div>
          <div class="lf-header-email-progress-bar" id="lfDashboardHeaderProgressBar" aria-hidden="true">
            <div class="lf-header-email-progress-fill" id="lfDashboardHeaderProgressFill"></div>
          </div>
        </div>
        <div class="lf-header-actions" role="toolbar" aria-label="Get Infinite Emails, account, and theme">
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-btn-upgrade-popup"
            id="lfDashboardUpgrade"
            aria-label="Get Infinite Emails (Stripe checkout)"
            title="Get Infinite Emails"
          >
            <span class="lf-upgrade-icon" aria-hidden="true">◇</span>
            <span class="lf-upgrade-label">Get Infinite Emails</span>
          </button>
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-btn-icon lf-account-btn"
            id="lfDashboardAccountBtn"
            aria-label="Account"
            title="Account"
          >
            <svg class="lf-header-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
              />
            </svg>
          </button>
          <button
            type="button"
            class="lf-btn lf-btn-ghost lf-theme-toggle"
            id="lfThemeToggle"
            aria-label="Switch to dark mode"
            title="Dark mode"
          >
            <span class="lf-theme-toggle-icon" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <p class="lf-dashboard-hint" id="lfDashboardHint">
        Progress and results for the current run. Mode, hashtag, and delays are in the toolbar popup.
      </p>
      <p class="lf-dashboard-cap-banner" id="lfDashboardCapBanner" hidden role="status"></p>

      <section class="lf-ai-panel" id="lfAiPanel" aria-labelledby="lfAiPanelTitle" hidden>
        <div class="lf-ai-panel-head">
          <h2 class="lf-ai-panel-title" id="lfAiPanelTitle">AI</h2>
          <p class="lf-ai-panel-desc" id="lfAiPanelDesc"></p>
        </div>
        <div class="lf-ai-panel-row">
          <label class="lf-check">
            <input type="checkbox" id="lfAiLlm" checked />
            <span id="lfAiLlmLabel"></span>
          </label>
          <label class="lf-check">
            <input type="checkbox" id="lfAiFetchUrl" checked />
            <span id="lfAiFetchUrlLabel"></span>
          </label>
          <label class="lf-check">
            <input type="checkbox" id="lfAiExcludeFake" checked />
            <span id="lfAiExcludeFakeLabel"></span>
          </label>
          <button type="button" class="lf-btn lf-btn-primary" id="lfAiEnrich"></button>
        </div>
        <p class="lf-ai-panel-status" id="lfAiStatus" aria-live="polite"></p>
      </section>

      <div class="lf-session-bar" id="lfSessionBar">
        <div class="lf-session-main">
          <div class="lf-session-title">Current extraction</div>
          <div class="lf-session-line">
            <span class="lf-session-target" id="lfSessionTarget">—</span>
            <span class="lf-session-mode" id="lfSessionMode"></span>
          </div>
          <div class="lf-session-goal" id="lfSessionGoal" hidden></div>
          <a
            class="lf-session-link"
            id="lfSessionLink"
            href="#"
            target="_blank"
            rel="noreferrer"
            hidden
            >Open source page on Instagram</a>
        </div>
        <div class="lf-session-aside">
          <p class="lf-session-running-note" id="lfSessionRunningNote" hidden></p>
          <button type="button" class="lf-btn lf-btn-primary lf-session-stop" id="lfDashboardStop">
            Start extraction
          </button>
        </div>
      </div>

      <div class="lf-progress-wrap">
        <div class="lf-progress-bar" id="lfProgressBar">
          <span class="lf-progress-fill" id="lfProgressFill"></span>
        </div>
        <div class="lf-progress-label" id="lfProgressLabel"></div>
        <div class="lf-progress-status" id="lfProgressStatus"></div>
      </div>

      <div class="lf-history-shell" id="lfHistoryShell">
        <button
          type="button"
          class="lf-history-toggle"
          id="lfHistoryToggle"
          aria-expanded="false"
          aria-controls="lfHistoryBody"
        >
          <span class="lf-history-toggle-label" id="lfHistoryLabel">Extraction history</span>
          <span class="lf-history-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="lf-history-body" id="lfHistoryBody" hidden>
          <div class="lf-history-head">
            <button type="button" class="lf-btn lf-btn-ghost lf-history-clear" id="lfHistoryClear">
              Clear history
            </button>
          </div>
          <div class="lf-history-list" id="lfHistoryList" role="listbox" aria-label="Extraction history"></div>
        </div>
      </div>

      <p class="lf-section-title">Results</p>
      <div class="lf-toolbar">
        <input type="search" id="lfFilter" placeholder="Filter by username, bio, email, phone, or website…" />
        <button type="button" class="lf-btn lf-btn-ghost" id="lfCopy">Copy selected</button>
        <button type="button" class="lf-btn lf-btn-ghost" id="lfExportProfiles">Export profiles to Excel</button>
        <button type="button" class="lf-btn lf-btn-ghost lf-btn-export-emails" id="lfExportEmails">
          Export emails to Excel
        </button>
        <button type="button" class="lf-btn lf-btn-ghost lf-btn-clear-list" id="lfClear">Clear list</button>
      </div>

      <div class="lf-table-wrap">
        <table class="lf-table" id="lfTable">
          <thead>
            <tr>
              <th class="lf-col-check"><input type="checkbox" id="lfSelectAll" title="Select all" /></th>
              <th data-sort="username">Username</th>
              <th data-sort="followerCount">Follower</th>
              <th data-sort="bio">Bio</th>
              <th data-sort="email">Email</th>
              <th data-sort="phone">Phone</th>
              <th data-sort="websiteUrl">Website</th>
            </tr>
          </thead>
          <tbody id="lfTableBody"></tbody>
        </table>
      </div>

      <footer class="lf-footer">Created by MegaMix AI, LLC</footer>
    </div>

    <div class="lf-modal-backdrop lf-export-format-wrap" id="lfExportFormatWrap" hidden>
      <div
        class="lf-modal-card lf-export-format-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lfExportFormatTitle"
      >
        <h3 class="lf-modal-title" id="lfExportFormatTitle"></h3>
        <p class="lf-account-modal-desc" id="lfExportFormatHint"></p>
        <div class="lf-export-format-actions">
          <button type="button" class="lf-btn lf-btn-primary" id="lfExportFormatXlsx"></button>
          <button type="button" class="lf-btn lf-btn-ghost" id="lfExportFormatCsv"></button>
        </div>
        <div class="lf-account-modal-actions lf-export-format-footer">
          <button type="button" class="lf-btn lf-btn-ghost" id="lfExportFormatCancel"></button>
        </div>
      </div>
    </div>

    <div class="lf-modal-backdrop lf-account-modal-wrap" id="lfAccountUsageWrap" hidden>
      <div
        class="lf-modal-card lf-account-modal lf-account-usage-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lfAccountUsageTitle"
      >
        <h3 class="lf-modal-title" id="lfAccountUsageTitle"></h3>
        <p class="lf-account-modal-line" id="lfAccountUsageSignedIn"></p>
        <p class="lf-account-modal-line" id="lfAccountUsageCount"></p>
        <div class="lf-account-usage-bar-wrap" aria-hidden="true">
          <div class="lf-account-usage-bar">
            <div class="lf-account-usage-bar-fill" id="lfAccountUsageBarFill"></div>
          </div>
          <div class="lf-account-usage-bar-label" id="lfAccountUsageBarLabel"></div>
        </div>
        <p class="lf-account-modal-desc" id="lfAccountUsageCapNote"></p>
        <p class="lf-account-modal-warn" id="lfAccountUsageAtCap" hidden></p>
        <div class="lf-account-usage-cta-row">
          <button type="button" class="lf-btn-stripe-diamond" id="lfAccountStripeDiamond" aria-label="">
            <span class="lf-btn-stripe-diamond-inner" aria-hidden="true"></span>
            <span class="lf-btn-stripe-diamond-label" id="lfAccountStripeDiamondLabel"></span>
          </button>
        </div>
        <div class="lf-account-modal-actions lf-account-modal-actions-footer">
          <button type="button" class="lf-btn lf-btn-ghost" id="lfAccountUsageLogout"></button>
          <button type="button" class="lf-btn lf-btn-ghost" id="lfAccountUsageClose"></button>
        </div>
      </div>
    </div>

    <div class="lf-ai-summary-wrap" id="lfAiSummaryWrap" hidden>
      <div class="lf-ai-summary-card" role="dialog" aria-modal="true" aria-labelledby="lfAiSummaryTitle">
        <h3 class="lf-ai-summary-title" id="lfAiSummaryTitle">Summary</h3>
        <p class="lf-ai-summary-line" id="lfAiSummaryScraped"></p>
        <p class="lf-ai-summary-line" id="lfAiSummaryAdded"></p>
        <p class="lf-ai-summary-improved" id="lfAiSummaryImproved"></p>
        <button type="button" class="lf-btn lf-btn-primary lf-ai-summary-ok" id="lfAiSummaryOk">OK</button>
      </div>
    </div>

    <div class="lf-josh-wrap" id="lfJoshAvatar" aria-hidden="false">
      <div class="lf-josh-thought-wrap" id="lfJoshThoughtWrap">
        <div class="lf-josh-thought-simple lf-josh-thought-bubble-hidden" id="lfJoshThoughtSimple">
          <span
            class="lf-josh-avatar-thought"
            id="lfJoshAvatarThought"
            tabindex="0"
            role="button"
            aria-label="Open Josh Q&A chat"
          ></span>
        </div>
        <div class="lf-josh-thought-chat hidden" id="lfJoshThoughtChat">
          <button type="button" class="lf-josh-thought-close" id="lfJoshThoughtClose" aria-label="Close">×</button>
          <div class="lf-josh-thought-messages" id="lfJoshThoughtMessages"></div>
          <div class="lf-josh-thought-chat-input-row">
            <input
              type="text"
              class="lf-josh-thought-chat-input"
              id="lfJoshThoughtChatInput"
              placeholder="Ask Josh about MegaLeadsAI…"
              autocomplete="off"
            />
            <button type="button" class="lf-josh-thought-chat-send" id="lfJoshThoughtChatSend" aria-label="Send">
              →
            </button>
          </div>
        </div>
      </div>
      <div class="lf-josh-avatar-bubble">
        <img src="Assets/Joshpropic.png" alt="Josh" class="lf-josh-avatar-img" draggable="false" />
      </div>
      <button type="button" class="lf-josh-avatar-help" id="lfJoshAvatarHelp" aria-label="Open Josh Q&A chat">?</button>
    </div>

    <script type="module" src="scripts/dashboard.js"></script>
  </body>
</html>
